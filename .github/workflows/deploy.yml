name: Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  FACADE_IMAGE: ${{ github.repository }}/stock-facade
  FRONTEND_IMAGE: ${{ github.repository }}/stock-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Facade image
        uses: docker/build-push-action@v5
        with:
          context: ./facade
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FACADE_IMAGE }}:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ secrets.AZURE_BACKEND_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy-facade:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy Facade to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FACADE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FACADE_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.FACADE_IMAGE }}:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy Frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
